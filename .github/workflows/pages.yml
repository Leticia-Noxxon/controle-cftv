# Publica o dashboard no GitHub Pages a cada push na branch main.
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Os dados já vêm processados em site/public/data (gerados por scripts/atualizar_dados.py), então o CI só compila o site.
# O build gera o site oficial (site/oficial) na raiz de site/dist, o backup (site/v1) em site/dist/v1 e o teste (site/v2) em site/dist/v2.
name: Publicar Controle de CFTV (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Instalar e compilar
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
