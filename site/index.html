<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de CFTV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%236366F1'/><circle cx='8' cy='8' r='3' fill='white'/></svg>" />
</head>
<body>

    <span class="nome">Controle de CFTV</span>

      <select id="f-camera" aria-label="Câmera"><option value="">Câmera</option></select>
      <input id="f-prefixo" type="search" placeholder="Prefixo" aria-label="Prefixo" />

  </header>
  <main>
    <section class="cards" id="cards"></section>
    <section class="matriz" id="matriz" aria-label="Matriz"></section>
  </main>
  <div id="pop" class="pop" role="tooltip"></div>
  <aside id="painel" class="painel" aria-hidden="true"><button class="fechar" id="fechar" aria-label="Fechar">×</button><div id="painel-corpo"></div></aside>
  <script type="module" src="/src/main.js"></script>

</html>
